version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fuel_bot_db
    environment:
      POSTGRES_USER: fuelbot
      POSTGRES_PASSWORD: fuelbot_password
      POSTGRES_DB: fuel_bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fuel_bot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
